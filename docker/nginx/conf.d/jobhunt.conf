# JobHunt reverse proxy — HTTP is redirected to HTTPS, HTTPS terminates TLS
# and forwards to php-fpm over the internal `backend` network. Nginx never
# talks to php-fpm's port on the host — only container-to-container on the
# docker network defined in docker-compose.yml.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/html;
    index index.php;

    client_max_body_size 10m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Uploaded CVs are served as plain downloads — never executed by nginx.
    # (PHP execution of an uploaded file only happens through the LFI bug
    # in dashboard/employer preview, not through nginx — see README §9.)
    location /uploads/ {
        location ~ \.php$ {
            deny all;
        }
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
