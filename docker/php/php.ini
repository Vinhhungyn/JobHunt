; JobHunt php.ini — intentionally misconfigured to mirror a real mid-size
; shop where these got turned on "temporarily" for debugging and never
; reverted. Each line notes what it enables for the lab.

; Error-based SQLi (job.php) and general recon rely on MySQL errors and
; stack traces reaching the response body instead of only the error log.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
html_errors = On

; Leaks "PHP/8.2.x" in the X-Powered-By header — trivial recon, kept on
; because "who cares, it's just a version number".
expose_php = On

; SSRF lab (webhook test) needs outbound requests via file_get_contents()/
; fopen() wrappers to work at all.
allow_url_fopen = On
allow_url_include = Off

; No open_basedir restriction — the LFI lab (dashboard/employer/preview.php)
; would be a dead end otherwise. A real hardened host would set this.
; open_basedir =

; Generous upload limits for CV files (PDF/DOCX up to a few MB).
upload_max_filesize = 8M
post_max_size = 10M
max_file_uploads = 5

; Session hardening left half-done: cookies are httponly (stops trivial
; document.cookie theft) but NOT marked Secure-only at the ini level —
; the app sets that flag itself in includes/session.php instead, and,
; as usual, only on some entry points.
session.cookie_httponly = 1
session.use_strict_mode = 1

memory_limit = 128M
max_execution_time = 30
